framework_version = "1"
profile = "generic"
harnesses = ["codex", "opencode"]
orchestration = true
caveman = true
ai_memory = true

[state]
# Portable evidence state. Data stays project-local; adapters never own it.
provider = "framework"
path = ".specs/features"

[project]
rules = "AGENTS.md"

[verification]
tests = true
analyze = true

# Decision Plane shadow observations are opt-in. Existing manifests without
# this section remain disabled.
[decision]
enabled = false
mode = "shadow"
providers = ["deterministic-safe"]
audit_path = ".agent-managed/runtime/decision-audit.jsonl"

[decision.jev]
endpoint = "https://api.typesafe.ai/v1/systemone"
model = "jev-latest"
timeout = 10.0

[decision.policy]
minimum_confidence = 0.7
reasoning_probability = 0.7
review_probability = 0.6
qa_probability = 0.6
escalation_probability = 0.7

[decision.context]
max_questions = 12
max_metadata_facts = 32
max_text_chars = 2000
max_bytes = 16384
